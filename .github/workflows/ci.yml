name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # Provide placeholder values so Next.js can build without real config
          NEXT_PUBLIC_USE_PRODUCTION_MODE: 'false'
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: 'ci_placeholder'
          NEXT_PUBLIC_SOLANA_NETWORK: 'devnet'
        run: npm run build
