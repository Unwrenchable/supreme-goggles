[package]
name = "domain-registry"
version = "1.0.0"
description = "Solana domain registration program with custom treasury addresses"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "domain_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
blake3 = "=1.5.1"

[dev-dependencies]
solana-program-test = "1.16.0"
solana-sdk = "1.16.0"

[profile.release]
overflow-checks = true
