[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
domain_registry = "DomAin1111111111111111111111111111111111111"

[programs.devnet]
domain_registry = "DomAin1111111111111111111111111111111111111"

[programs.mainnet]
domain_registry = "DomAin1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
